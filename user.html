<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mitt Schema - STRUL</title>
    
    <!-- PWA / App Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0277bd">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="admin.css">
    <script type="module" src="js/main.js"></script>
</head>
<body class="admin-view" id="page-user">

    <div class="admin-wrapper">
        <header class="admin-header">
            <div class="header-content">
                <div style="display:flex; align-items:center; gap:20px;">
                    <h1>STRUL - Veckoschema</h1>
                </div>
                <div style="display:flex; align-items:center;">
                    <span id="currentUserDisplay">Laddar...</span>
                    <button id="logoutBtn" class="logout-btn">Logga ut</button>
                </div>
            </div>
        </header>

        <div class="admin-layout">
            <main class="admin-main">
                
                <!-- Navigering för veckor -->
                <div class="date-navigation" style="justify-content: center; margin-bottom: 20px;">
                    <button id="prevDayBtn" class="nav-arrow" title="Föregående">◀</button>
                    <div id="currentDateDisplay" style="font-size: 1.2rem; font-weight: bold; margin: 0 20px;">Laddar...</div>
                    <button id="nextDayBtn" class="nav-arrow" title="Nästa">▶</button>
                    <!-- Osynlig datepicker som js letar efter -->
                    <input type="date" id="userDatePicker" style="display:none;">
                </div>

                <!-- Det breda original-schemat -->
                <div class="schedule-card">
                    <div class="grid-container" id="scheduleContainer">
                        <!-- Här ritar js/utils.js upp tabellen -->
                    </div>
                </div>

            </main>
        </div>
    </div>

    <div id="toast-container"></div> 
</body>
</html>
