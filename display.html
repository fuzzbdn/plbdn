<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display - Dagens Schema</title>
    
    <!-- Typsnitt: Inter för brödtext, JetBrains Mono för klockan (monospaced siffror) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Externa bibliotek (WebSockets för realtidsuppdateringar) -->
    <script src="https://js.pusher.com/8.4.0/pusher.min.js"></script>
    
    <!-- Systemets kärnfiler -->
    <script type="module" src="js/main.js"></script>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/display.css">
</head>
<body class="display-view" id="page-display">

<div class="display-wrapper">
    
    <!-- ========================================== -->
    <!-- 1. TOP BAR (Logga, Väder & Klocka)         -->
    <!-- ========================================== -->
    <div class="top-bar">
        
        <!-- Arbetsplatsens namn. Fylls i dynamiskt av display.js -->
        <h1 id="mainTitle">Laddar...</h1> 
        
        <div style="display:flex; align-items:center;">
            
            <!-- Väder-widget. Fylls av startWeatherUpdates() -->
            <div id="weatherWidget"></div> 
            
            <!-- Digital Klocka. Uppdateras varje sekund av initClock() -->
            <div id="clock">00:00</div>
            
            <!-- Puls-indikator för WebSockets. 
                 Grå = Ansluter, Grön = Uppkopplad mot Pusher, Röd = Nerkopplad -->
            <span id="connectionDot" title="Ansluter..." style="width:12px; height:12px; border-radius:50%; background-color:#9e9e9e; margin-left:15px; display:inline-block; flex-shrink:0;"></span>
        </div>
    </div>
    
    <!-- ========================================== -->
    <!-- 2. RULLANDE MEDDELANDE (Marquee)           -->
    <!-- ========================================== -->
    <!-- Dold som standard. Visas bara om admin har angett ett meddelande under Inställningar -->
    <div id="marqueeContainer">
        <marquee id="marqueeText" scrollamount="10"></marquee>
    </div>
    
    <!-- ========================================== -->
    <!-- 3. HUVUDYTA: SCHEMARUTNÄT                  -->
    <!-- ========================================== -->
    <!-- Containern för dagens schema. 
         Fylls dynamiskt med stationer och pass av renderDisplay() i display.js -->
    <div id="mainContainer"></div>

</div>

<!-- ========================================== -->
<!-- 4. DOLDA KOMPONENTER (Notiser)             -->
<!-- ========================================== -->
<!-- Behållare för systemmeddelanden (Toast) om t.ex. nätverket bryts -->
<div id="toast-container"></div> 

</body>
</html>
