<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inställningar - STRUL</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="admin.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="script.js" defer></script>

    <style>
        .settings-container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; }
        .setting-card { background: #fff; border: 1px solid #ccc; border-radius: 8px; padding: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .setting-card h3 { margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 15px; color: #333; }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; gap: 5px; }
        .form-group label { font-weight: 600; font-size: 0.9rem; color: #555; }
        input[type="text"], input[type="password"], input[type="email"], select { padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 1rem; }
        
        .save-btn { background-color: #007bff; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; }
        .save-btn:hover { background-color: #0056b3; }
        
        /* Knappar för listor */
        .list-btn { border: none; background: none; cursor: pointer; font-size: 1.1rem; padding: 5px; }
        .list-btn:hover { opacity: 0.7; }

        .list-container { max-height: 250px; overflow-y: auto; border: 1px solid #eee; border-radius: 4px; background: #fafafa; }
        
        /* Cancel-knapp som visas vid editering */
        .cancel-edit-btn { background: #999; color: white; border: none; padding: 0 10px; border-radius: 4px; cursor: pointer; display: none; }
    </style>
</head>
<body id="page-settings">

    <header class="admin-header">
        <div class="header-content">
            <div style="display:flex; align-items:center; gap:20px;">
                <h1>⚙️ Inställningar</h1>
                <a href="admin.html" style="color:white; text-decoration:none; background:rgba(255,255,255,0.2); padding:5px 10px; border-radius:4px; font-size:0.9rem;">⬅ Tillbaka</a>
            </div>
            <div style="display:flex; align-items:center; gap:15px;">
                <span id="currentUserDisplay" style="font-weight:600; color:#eee;"></span>
                <button id="logoutBtn" class="logout-btn">Logga ut</button>
            </div>
        </div>
    </header>

    <div class="settings-container">
        <div class="settings-grid">
            
            <div class="setting-card">
                <h3>🎨 Utseende & Tema</h3>
                <div class="form-group">
                    <label>Välj färgtema:</label>
                    <select id="themeSelect">
                        <option value="light">Ljus (Standard)</option>
                        <option value="dark">Mörk (Dark Mode)</option>
                        <option value="jul">Jul-tema 🎅</option>
                        <option value="pask">Påsk-tema 🐣</option>
                        <option value="matrix">Matrix 🟢</option>
                    </select>
                </div>
                <button id="saveThemeBtn" class="save-btn">Spara Tema</button>
            </div>

            <div class="setting-card">
                <h3>📢 Meddelande</h3>
                <div class="form-group">
                    <label>Rullande text:</label>
                    <input type="text" id="displayMessageInput" placeholder="Text...">
                </div>
                <div class="form-group" style="flex-direction:row; align-items:center; gap:10px;">
                    <input type="checkbox" id="showMessageCheckbox" style="width:auto; margin:0;">
                    <label for="showMessageCheckbox" style="margin:0; cursor:pointer;">Visa meddelande</label>
                </div>
                <button id="saveMessageBtn" class="save-btn" style="background-color:#e67e22;">Uppdatera</button>
            </div>

            <div class="setting-card">
                <h3>📍 Hantera Platser</h3>
                <div class="form-group">
                    <div style="display:flex; gap:5px;">
                        <input type="text" id="newStationName" placeholder="Namn" style="flex:1;">
                        <input type="color" id="newStationColor" value="#cccccc" style="width:40px; height:38px; padding:0; border:none; cursor:pointer;">
                        <button id="addStationBtn" class="save-btn" style="width:auto; background:#4CAF50;">+</button>
                        <button id="cancelStationEditBtn" class="cancel-edit-btn">❌</button>
                    </div>
                    <button id="addSpacerBtn" class="save-btn" style="background:#7f8c8d; font-size:0.85rem; padding:5px; margin-top:5px;">➕ Lägg till Mellanrum</button>
                </div>
                <div style="margin-top:10px;">
                    <h4 style="font-size:0.9rem; color:#666; margin-bottom:5px;">Lista:</h4>
                    <div id="stationListContainer" class="list-container">Laddar...</div>
                </div>
            </div>

            <div class="setting-card">
                <h3>⏰ Hantera Pass</h3>
                <div class="form-group">
                    <div style="display:flex; flex-direction:column; gap:8px;">
                        <input type="text" id="newShiftLabel" placeholder="Etikett (t.ex. Förmiddag)">
                        <input type="text" id="newShiftTime" placeholder="Tid (t.ex. 06:30 - 14:00)">
                        <div style="display:flex; gap:5px;">
                            <button id="addShiftBtn" class="save-btn" style="background:#4CAF50;">Lägg till Pass</button>
                            <button id="cancelShiftEditBtn" class="cancel-edit-btn">❌</button>
                        </div>
                    </div>
                </div>
                <div style="margin-top:10px;">
                    <h4 style="font-size:0.9rem; color:#666; margin-bottom:5px;">Nuvarande pass:</h4>
                    <div id="shiftListContainer" class="list-container">Laddar...</div>
                </div>
            </div>

            <div class="setting-card" style="grid-column: 1 / -1;">
                <h3>👤 Hantera Administratörer</h3>
                <div class="form-group" style="background:#f0f8ff; padding:15px; border-radius:6px; border:1px solid #cce5ff;">
                    <label style="margin-bottom:10px; display:block; color:#0056b3;">Hantera admin:</label>
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:10px;">
                        <input type="text" id="newAdminFirstName" placeholder="Förnamn">
                        <input type="text" id="newAdminLastName" placeholder="Efternamn">
                    </div>
                    <input type="email" id="newAdminEmail" placeholder="E-post" style="width:100%; margin-bottom:10px; box-sizing:border-box;">
                    <div style="display:flex; gap:10px;">
                        <input type="text" id="newAdminUser" placeholder="Användarnamn" style="flex:1;">
                        <input type="text" id="newAdminPass" placeholder="Lösenord" style="flex:1;">
                        <button id="addAdminBtn" class="save-btn" style="width:60px; background:#28a745;">+</button>
                        <button id="cancelAdminEditBtn" class="cancel-edit-btn" style="display:none;">❌</button>
                    </div>
                </div>
                <div style="margin-top:20px;">
                    <h4 style="margin:0 0 10px 0; font-size:0.9rem; color:#666;">Befintliga administratörer:</h4>
                    <div id="adminListContainer" class="list-container">Laddar...</div>
                </div>
            </div>

        </div>
    </div>
</body>
</html>
