<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inställningar - STRUL</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="admin.css"> <script src="script.js" defer></script>
    <style>
        /* Specifik CSS för inställningssidan */
        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .setting-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 8px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }
        .setting-card h3 { margin-top: 0; color: var(--header-text); border-bottom: 2px solid var(--border-color); padding-bottom: 10px; margin-bottom: 20px; }
        
        /* Admin-listan styling */
        .admin-list-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px; border-bottom: 1px solid #eee;
        }
        .admin-list-item:last-child { border-bottom: none; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.9rem; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        
        .btn-danger { background-color: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }
        .btn-danger:hover { background-color: #ffcdd2; }
        
        .back-nav { max-width: 1200px; margin: 0 auto 20px auto; display: flex; align-items: center; gap: 10px; }
        .back-btn { text-decoration: none; color: #333; font-weight: bold; display: flex; align-items: center; gap: 5px; }
        .back-btn:hover { color: var(--btn-primary); }
    </style>
</head>
<body class="admin-view" id="page-settings">

    <header class="admin-header">
        <div class="header-content">
            <h1>⚙️ Inställningar</h1>
            <div style="display:flex; align-items:center; gap:15px;">
                <span id="currentUserDisplay" style="font-weight:600; color:#555;"></span>
                <button id="logoutBtn" class="logout-btn">Logga ut</button>
            </div>
        </div>
    </header>

    <div class="back-nav">
        <a href="admin.html" class="back-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            Tillbaka till Planering
        </a>
    </div>

    <div class="settings-grid">
        
        <div class="setting-card">
            <h3>🎨 Utseende & Tema</h3>
            <p style="color:#666; font-size:0.9rem; margin-bottom:15px;">Detta ändrar utseendet på den stora statusskärmen.</p>
            <div class="form-group">
                <label for="themeSelect">Välj Tema:</label>
                <select id="themeSelect">
                    <option value="light">Ljust (Standard)</option>
                    <option value="dark">Mörkt (Dark Mode)</option>
                    <option value="jul">Norrsken (Aurora)</option>
                    <option value="pask">Påsktema (Pastell)</option>
                    <option value="matrix">Matrix (Hacker)</option>
                </select>
            </div>
            <button id="saveThemeBtn" class="sidebar-add-btn" style="width:100%; height:auto; padding:10px; font-size:1rem;">Spara Tema</button>
        </div>

        <div class="setting-card">
            <h3>📢 Meddelande till Display</h3>
            <p style="color:#666; font-size:0.9rem; margin-bottom:15px;">Visa ett viktigt meddelande eller info högst upp på skärmen.</p>
            <div class="form-group">
                <label for="displayMessageInput">Meddelande:</label>
                <textarea id="displayMessageInput" rows="3" placeholder="T.ex. 'Personalmöte kl 14:00'"></textarea>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
                    <input type="checkbox" id="showMessageCheckbox"> Visa på skärmen
                </label>
                <button id="saveMessageBtn" class="sidebar-add-btn" style="width:auto; height:auto; padding:8px 15px; font-size:0.9rem;">Uppdatera</button>
            </div>
        </div>

        <div class="setting-card">
                    <h3>👤 Hantera Administratörer</h3>
                    
                    <div class="form-group" style="background:#f9f9f9; padding:15px; border-radius:4px; border:1px solid #eee;">
                        <label style="margin-bottom:10px; display:block;">Lägg till ny admin:</label>
                        
                        <div style="display:flex; gap:10px; margin-bottom:10px;">
                            <input type="text" id="newAdminFirstName" placeholder="Förnamn" style="flex:1;">
                            <input type="text" id="newAdminLastName" placeholder="Efternamn" style="flex:1;">
                        </div>
        
                        <div style="display:flex; gap:10px;">
                            <input type="text" id="newAdminUser" placeholder="Användarnamn (t.ex. mormag01)" style="flex:1;">
                            <input type="text" id="newAdminPass" placeholder="Lösenord" style="flex:1;">
                            <button id="addAdminBtn" class="sidebar-add-btn" style="width:50px; font-size:1.2rem; background:#4CAF50;">+</button>
                        </div>
                    </div>
        
                    <div style="margin-top:20px;">
                        <h4 style="margin:0 0 10px 0; font-size:0.9rem; color:#666;">Nuvarande admins:</h4>
                        <div style="max-height: 200px; overflow-y:auto; border-top:1px solid #eee;">
                            <div id="adminListContainer">Laddar...</div>
                        </div>
                    </div>
                </div>

    </div>

</body>

</html>
