<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Preview</title>
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="display.css">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: var(--bg-color);
            /* Centrera innehållet vid skalning */
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        /* En container som simulerar en stor skärm */
        #scaler {
            width: 1280px;  /* Simulerad bredd */
            height: 720px;  /* Simulerad höjd (16:9) */
            transform-origin: top left;
            background-color: var(--bg-color); /* Viktigt för temat */
            overflow: hidden;
            position: absolute;
            top: 0;
            left: 0;
        }
        
        /* Justeringar för att det ska se snyggt ut i preview */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

<div id="scaler">
    <div class="display-wrapper">
        <div class="top-bar">
            <h1 id="mainTitle">Förhandsgranskning</h1>
            <div style="display:flex; align-items:center;">
                <div id="weatherWidget" style="margin-right:20px; font-weight:700;">BODEN: -5°C</div>
                <div id="clock">12:00</div>
            </div>
        </div>
        
        <div id="mainContainer" style="margin-top: 20px;">
            <div class="time-header-row" style="display:grid; grid-template-columns: 220px 1fr 1fr; gap:1.5vw;">
                <div></div>
                <div class="time-header">Förmiddag</div>
                <div class="time-header">Eftermiddag</div>
            </div>

            <div class="display-row" style="display:grid; grid-template-columns: 220px 1fr 1fr; gap:1.5vw;">
                <div class="station-label" style="--station-color:#ffb74d; --contrast-color:#000;">Björkliden</div>
                <div class="shift-card">Anders</div>
                <div class="shift-card">Bertil</div>
            </div>

            <div class="display-row" style="display:grid; grid-template-columns: 220px 1fr 1fr; gap:1.5vw;">
                <div class="station-label" style="--station-color:#81c784; --contrast-color:#000;">Boden</div>
                <div class="shift-card">Cecilia</div>
                <div class="shift-card empty"></div>
            </div>

             <div class="display-row" style="display:grid; grid-template-columns: 220px 1fr 1fr; gap:1.5vw;">
                <div class="station-label" style="--station-color:#64b5f6; --contrast-color:#000;">Gällivare</div>
                <div class="shift-card empty"></div>
                <div class="shift-card">David</div>
            </div>
        </div>
    </div>
</div>

<script>
    // Skript för att automatiskt skala innehållet så det passar fönstret
    function fitToScreen() {
        const scaler = document.getElementById('scaler');
        const availableWidth = window.innerWidth;
        const availableHeight = window.innerHeight;
        
        const scaleX = availableWidth / 1280;
        const scaleY = availableHeight / 720;
        
        // Välj den skala som passar bäst (contain)
        const scale = Math.min(scaleX, scaleY);
        
        scaler.style.transform = `scale(${scale})`;
    }

    window.addEventListener('resize', fitToScreen);
    // Kör direkt
    fitToScreen();
    // Kör igen efter en kort stund ifall iframen ändrar storlek
    setTimeout(fitToScreen, 100);
</script>

</body>
</html>
