<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STRUL - Logga in</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body class="login-view" id="page-login">
    
    <div class="login-container">
        
        <div class="login-card">
            
            <div class="brand-section">
                <div class="logo-circle">
                    <svg class="train-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M18 11c0-1-1-2-3-2h-1.6c-.6-1.2-1.4-2.3-2.3-3.2L12.5 4.4C12.2 4.1 12 3.6 12 3c0-.6.4-1 .9-1.3C13.4 1.5 13.7 1 13.7 1s-5.3 0-6.8 2.6C6.4 4.5 6 5.8 6 7v4c0 1-1 2-3 2v4l1.5 1.5v2h2v-1h11v1h2v-2l1.5-1.5v-4c-2 0-3-1-3-2zM8 12c-.6 0-1-.4-1-1s.4-1 1-1 1 .4 1 1-.4 1-1 1zm8 0c-.6 0-1-.4-1-1s.4-1 1-1 1 .4 1 1-.4 1-1 1zm1.5-6H14v2h3.5V6z"/>
                    </svg>
                </div>
                <h1 class="brand-title">STRUL</h1>
                <p class="brand-subtitle">Strategisk Tidsplanering & Resurs-Utnyttjande i Ledningscentralen</p>
            </div>

            <div class="form-section">
                <div class="input-wrapper">
                    <input type="password" id="passwordInput" placeholder="Ange lösenord" autocomplete="off">
                    <div class="input-icon">🔒</div>
                </div>

                <button id="loginBtn" class="login-btn">
                    Logga in
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                </button>
            </div>

            <div class="footer-links">
                <div class="divider">ELLER</div>
                <a href="display.html" class="display-link">📺 Visa Schema (Display)</a>
            </div>

        </div>
        
        <p class="copyright">© 2024 STRUL Ledningssystem</p>
    </div>

</body>
</html>
