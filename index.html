<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inloggning - STRUL</title>
    
    <!-- PWA / App Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0277bd">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="login.css">
    <script type="module" src="js/main.js"></script>
</head>
<body>
    <div class="login-container">
        
        <div id="loginForm" class="login-card">
            
            <!-- Original-loggan (Node-ikonen i ljusblå cirkel) -->
            <div class="login-logo" style="background-color: #e1f0fa; width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px auto;">
                <svg viewBox="0 0 24 24" width="45" height="45" fill="#0277bd">
                    <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3v.15l-2.43 1.15c-.45-.19-.94-.3-1.46-.3-1.74 0-3.18 1.14-3.73 2.7l-1.92-.64C3.65 10.45 4 9.77 4 9c0-1.66-1.34-3-3-3S-2 7.34-2 9c0 1.66 1.34 3 3 3 .47 0 .91-.11 1.31-.3l1.83.61C4.05 12.63 4 12.81 4 13c0 1.66 1.34 3 3 3 1.05 0 1.98-.55 2.53-1.38l2.6 1.5c-.08.28-.13.57-.13.88 0 1.66 1.34 3 3 3s3-1.34 3-3-1.34-3-3-3c-.88 0-1.67.38-2.23 1l-2.71-1.57c.36-.67.58-1.44.58-2.25 0-.4-.06-.79-.16-1.16L13.1 9.8c.84.7 1.94 1.2 3.1 1.2zm-9 0c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm0 6c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm9 2c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm0-10c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/>
                </svg>
            </div>
            
            <h1 style="text-align: center; font-size: 2.5rem; font-weight: 800; color: #111; margin-bottom: 5px;">STRUL <span style="font-size: 1rem; color: #999; font-weight: 600;">v2.0</span></h1>
            <p class="subtitle" style="text-align: center; color: #666; margin-bottom: 30px; font-size: 1.1rem; line-height: 1.4;">Strategisk Tidsplanering & Resurs-<br>Utnyttjande i Ledningscentralen</p>
            
            <div class="input-group">
                <!-- Rätt ID och mobilanpassning -->
                <input type="text" id="username" placeholder="Användarnamn" autocomplete="username" autocapitalize="none" autocorrect="off" style="width: 100%; padding: 15px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; box-sizing: border-box; margin-bottom: 15px;">
            </div>
            <div class="input-group">
                <!-- Rätt ID -->
                <input type="password" id="password" placeholder="Lösenord" autocomplete="current-password" style="width: 100%; padding: 15px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; box-sizing: border-box; margin-bottom: 20px;">
            </div>
            
            <!-- Rätt ID på knappen -->
            <button id="loginBtn" class="login-btn" style="width: 100%; background-color: #0277bd; color: white; border: none; padding: 15px; border-radius: 6px; font-size: 1.1rem; font-weight: 800; cursor: pointer; box-shadow: 0 4px 6px rgba(2, 119, 189, 0.2);">Logga in</button>
            
            <div style="text-align: center; margin-top: 25px;">
                <a href="#" id="forgotPassLink" class="forgot-link" style="color: #0277bd; font-weight: 600; text-decoration: none;">Glömt lösenord?</a>
            </div>
        </div>
        
    </div>

    <div id="toast-container"></div>
    
    <!-- Osynligt skript som låter mobilen logga in när man trycker på Enter/Gå -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const passInput = document.getElementById('password');
            const loginBtn = document.getElementById('loginBtn');
            
            if (passInput && loginBtn) {
                passInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        loginBtn.click();
                    }
                });
            }
        });
    </script>
</body>
</html>
