<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inloggning - STRUL</title>
    
    <!-- PWA / App Inställningar -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0277bd">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="login.css">
    <script type="module" src="js/main.js"></script>
</head>
<body class="login-view">

    <div class="login-container">
        
        <!-- EXAKT ORIGINALSTRUKTUR (Inga form-taggar som förstör designen) -->
        <div id="loginForm" class="login-card">
            
            <div class="login-logo">
                <svg viewBox="0 0 24 24" width="48" height="48" fill="#0277bd">
                    <path d="M19 15v-3h-2v3h-3v2h3v3h2v-3h3v-2h-3zm-7 3c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm-5-3c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm10-10c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zM7 5c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm5 5c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/>
                    <path d="M12 9c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3zm0 4c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/>
                </svg>
            </div>
            
            <h1>STRUL <span style="font-size:0.4em; color:#888; font-weight:normal;">v2.0</span></h1>
            <p class="subtitle">Strategisk Tidsplanering & Resurs-<br>Utnyttjande i Ledningscentralen</p>
            
            <div class="input-group">
                <!-- autocapitalize="none" fixar problemet med att mobilen gör första bokstaven stor -->
                <input type="text" id="usernameInput" placeholder="Användarnamn" autocomplete="username" autocapitalize="none" autocorrect="off">
            </div>
            <div class="input-group">
                <input type="password" id="passwordInput" placeholder="Lösenord" autocomplete="current-password">
            </div>
            
            <button id="loginBtn" class="login-btn">Logga in</button>
            <a href="#" id="forgotPassLink" class="forgot-link">Glömt lösenord?</a>
        </div>
        
        <div id="forgotForm" class="login-card" style="display:none;">
            <div class="login-logo">
                <svg viewBox="0 0 24 24" width="48" height="48" fill="#0277bd">
                    <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6zm9 14H6V10h12v10zm-6-3c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z"/>
                </svg>
            </div>
            <h1>Återställ</h1>
            <p class="subtitle">Skriv in din e-postadress så skickar vi en länk för att välja ett nytt lösenord.</p>
            
            <div class="input-group">
                <input type="email" id="resetEmailInput" placeholder="Din E-post" autocapitalize="none" autocorrect="off">
            </div>
            <button id="sendResetBtn" class="login-btn">Skicka länk</button>
            <a href="#" id="backToLoginLink" class="forgot-link">Tillbaka till inloggning</a>
        </div>
        
    </div>

    <div id="toast-container"></div>
    
    <!-- Litet skript som fångar upp Enter/Gå-knappen på mobiltangentbordet och loggar in automatiskt -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const passInput = document.getElementById('passwordInput');
            const loginBtn = document.getElementById('loginBtn');
            
            if (passInput && loginBtn) {
                passInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        loginBtn.click();
                    }
                });
            }
        });
    </script>
</body>
</html>
