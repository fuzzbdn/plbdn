<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STRUL - Logga in</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body class="login-view" id="page-login">
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <div class="icon-bg">🔐</div>
                
                <h1 class="strul-title">STRUL</h1>
                <p class="strul-desc">Strategisk Tidsplanering & Resurs-Utnyttjande i Ledningscentralen</p>
                
            </div>
            
            <div class="login-form">
                <div class="input-group">
                    <input type="password" id="passwordInput" placeholder="Ange admin-lösenord">
                </div>
                
                <button id="loginBtn" class="action-btn primary">Logga in</button>
                
                <div class="divider">
                    <span>ELLER</span>
                </div>

                <a href="display.html" class="action-btn secondary">📺 Visa Schema (Display)</a>
            </div>
        </div>
    </div>
</body>
</html>
