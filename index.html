<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inloggning - STRUL</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0277bd">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="login.css">
    <script type="module" src="js/main.js"></script>
</head>
<body>
    <div class="login-container">
        
        <!-- Tillbaka till DIV så att din login.css fungerar perfekt på datorn -->
        <div id="loginForm" class="login-card">
            
            <!-- En osynlig form-tagg löser mobilens tangentbordsproblem utan att krascha designen -->
            <form onsubmit="event.preventDefault(); document.getElementById('loginBtn').click();" style="display: contents;">
                <h1>STRUL</h1>
                <p class="subtitle">Bemanningssystem</p>
                
                <div class="input-group">
                    <!-- Stänger av stor bokstav och auto-rättning -->
                    <input type="text" id="usernameInput" placeholder="Användarnamn" autocomplete="username" autocapitalize="none" autocorrect="off">
                </div>
                
                <div class="input-group">
                    <input type="password" id="passwordInput" placeholder="Lösenord" autocomplete="current-password">
                </div>
                
                <button type="submit" id="loginBtn" class="login-btn">Logga in</button>
                <a href="#" id="forgotPassLink" class="forgot-link">Glömt lösenord?</a>
            </form>
        </div>
        
        <!-- Samma sak för Återställnings-rutan -->
        <div id="forgotForm" class="login-card" style="display:none;">
            <form onsubmit="event.preventDefault(); document.getElementById('sendResetBtn').click();" style="display: contents;">
                <h1>Återställ</h1>
                <p class="subtitle">Skriv in din e-postadress</p>
                <div class="input-group">
                    <input type="email" id="resetEmailInput" placeholder="Din E-post" autocapitalize="none" autocorrect="off">
                </div>
                <button type="submit" id="sendResetBtn" class="login-btn">Skicka länk</button>
                <a href="#" id="backToLoginLink" class="forgot-link">Tillbaka till inloggning</a>
            </form>
        </div>
        
    </div>
    <div id="toast-container"></div>
</body>
</html>
