<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Bemanningsplanering</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="admin.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="script.js" defer></script>
</head>
<body class="admin-view" id="page-admin">
<div class="admin-wrapper">
<header class="admin-header">
    <div class="header-content">
        <h1>Adminpanel</h1>
        <button id="logoutBtn" class="logout-btn">
            Logga ut
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        </button>
    </div>
</header>

    <div class="controls-bar">
        <div class="week-nav-container">
            <button id="prevWeekBtn" class="nav-btn">← Föregående</button>
            <span id="currentWeekDisplay">Vecka ...</span>
            <button id="nextWeekBtn" class="nav-btn">Nästa →</button>
        </div>

        <div class="nav-days-container">
            <div class="nav-days" id="weekNav"></div>
        </div>
    </div>

    <div class="admin-layout">
        
<div class="sidebar-roster">
    <div class="roster-card">
        <h3>Personal</h3>
        
        <div class="sidebar-add-row">
            <input type="text" id="sidebarNewName" placeholder="Namn..." class="sidebar-input">
            <button id="sidebarAddBtn" class="sidebar-add-btn">+</button>
        </div>

        <p class="roster-hint">Dra namn till schemat</p>
        
        <div id="draggableUserList" class="roster-list">
            </div>
    </div>
</div>

        <div class="schedule-card-wrapper">
            <div class="schedule-card">
                <div class="grid-container" id="scheduleContainer"></div>
            </div>
            <div class="theme-selector" style="margin-left: 20px; display:inline-block;">
                <label for="themeSelect" style="font-weight:bold; margin-right:5px;">Skärmtema:</label>
                <select id="themeSelect" style="padding: 8px; border-radius: 4px;">
                    <option value="light">Ljust (Standard)</option>
                    <option value="dark">Mörkt (Dark Mode)</option>
                </select>
            </div>
            <div class="export-container">
                <button id="printBtn" class="export-button">
                    🖨️ Skriv ut
                </button>
                <button id="exportBtn" class="export-button">
                    📷 Spara som bild
                </button>
            </div>
        </div>
    </div>

</div>
</body>

</html>
