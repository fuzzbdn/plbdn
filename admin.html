<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Bemanningsplanering</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="admin.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="script.js" defer></script>
</head>
<body class="admin-view" id="page-admin">
<div class="admin-wrapper">
    
    <header class="admin-header">
        <div class="header-content">
            <div style="display:flex; align-items:center; gap:25px;">
                <h1>Adminpanel</h1>
                <div class="header-datepicker">
                    <label for="adminDatePicker">Planeringsdatum:</label>
                    <input type="date" id="adminDatePicker">
                </div>
            </div>
            
            <div style="display:flex; align-items:center; gap:15px;">
                <span id="currentUserDisplay" style="font-weight:600; color:#555;"></span>
                <button id="manageAdminsBtn" class="logout-btn" style="background:#e3f2fd; color:#0d47a1;">👤 Admins</button>
                <button id="logoutBtn" class="logout-btn">Logga ut</button>
            </div>
        </div>
    </header>

    <div class="status-bar">
        <div id="currentDateDisplay"></div>
    </div>

    <div class="admin-layout">
        <aside class="sidebar-roster">
            <div class="roster-card">
                <h3>Personal</h3>
                <div class="sidebar-add-row">
                    <input type="text" id="sidebarNewName" placeholder="Nytt namn..." class="sidebar-input">
                    <button id="sidebarAddBtn" class="sidebar-add-btn">+</button>
                </div>
                <div id="draggableUserList" class="roster-list"></div>
            </div>
        </aside>

        <main class="schedule-card-wrapper">
            <div class="schedule-card">
                <div class="grid-container" id="scheduleContainer"></div>
            </div>
            
            <footer class="export-container">
                <div class="theme-controls">
                    <span>Tema:</span>
                    <select id="themeSelect">
                        <option value="light">Ljust (Standard)</option>
                        <option value="dark">Mörkt (Dark Mode)</option>
                        <option value="jul">Norrsken (Aurora)</option>
                        <option value="pask">Påsktema (Pastell)</option>
                        <option value="matrix">Matrix (Hacker)</option>
                    </select>
                    <button id="saveThemeBtn" class="export-button">Spara tema</button>
                </div>
                <div class="action-buttons">
                    <button id="printBtn" class="export-button">🖨️ Skriv ut</button>
                    <button id="exportBtn" class="export-button">📷 Spara som bild</button>
                </div>
            </footer>
        </main>
    </div>
</div>
<div id="print-container"></div>
</body>
</html>
